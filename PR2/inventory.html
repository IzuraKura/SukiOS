<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Microbusiness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Collapsible Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <h2>Suki<span>OS</span></h2>
                <button id="sidebar-toggle" class="btn-icon" aria-label="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                    <span class="link-text">Dashboard</span>
                </a>
                <a href="inventory.html" class="nav-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    <span class="link-text">Inventory</span>
                </a>
                <a href="pos.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="link-text">POS Kiosk</span>
                </a>
                <a href="analytics.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <span class="link-text">Analytics</span>
                </a>
            </nav>
            <div class="theme-control">
                <button id="theme-toggle" class="btn-secondary">Theme Switch</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <header class="page-header">
                <div>
                    <h1 class="page-title">Inventory Management</h1>
                    <p class="text-muted">Track stock levels, costs, and product categories.</p>
                </div>
                <div class="quick-actions">
                    <button class="btn-primary" id="open-modal-btn">+ Add Item</button>
                </div>
            </header>

            <!-- Table Filter Toolbar -->
            <section class="card toolbar-card">
                <div class="toolbar-controls">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Search product name or SKU...">
                    </div>
                    <div class="filter-box">
                        <select id="category-filter">
                            <option value="all">All Categories</option>
                            <option value="Snacks & Sweets">Snacks, Candies & Chocolates</option>
                            <option value="Beverages">Beverages (Soda, Coffee, Juice)</option>
                            <option value="Bakery & Pastries">Bread & Pastries</option>
                            <option value="Daily Ulam">Daily Ulam</option>
                            <option value="General Supplies">General Supplies</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Inventory Data Table -->
            <section class="card table-card">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Cost Price</th>
                                <th>Selling Price</th>
                                <th>Stock Quantity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body">
                            <!-- Dynamic empty state when starting from scratch -->
                            <tr id="empty-row">
                                <td colspan="7" class="empty-state">
                                    <p class="text-muted">No inventory items available. Click <strong>+ Add Item</strong> to add your first product.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal Form: Add / Edit Product -->
    <div class="modal-overlay" id="item-modal">
        <div class="card modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Add New Inventory Item</h3>
                <button class="btn-icon" id="close-modal-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="item-form">
                <div class="form-group">
                    <label for="item-name">Product Name</label>
                    <input type="text" id="item-name" placeholder="e.g., Espresso Coffee Beans" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="item-category">Category</label>
                        <select id="item-category" required>
                            <option value="Snacks & Sweets">Snacks, Candies & Chocolates</option>
                            <option value="Beverages">Beverages (Soda, Coffee, Juice)</option>
                            <option value="Bakery & Pastries">Bread & Pastries</option>
                            <option value="Daily Ulam">Daily Ulam</option>
                            <option value="General Supplies">General Supplies</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-stock">Stock Quantity</label>
                        <input type="number" id="item-stock" min="0" placeholder="0" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="item-cost">Cost Price (₱)</label>
                        <input type="number" id="item-cost" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="item-price">Selling Price (₱)</label>
                        <input type="number" id="item-price" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
