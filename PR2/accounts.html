<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts | KitaKita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <h2>Kita<span>Kita</span></h2>
                <button id="sidebar-toggle" class="btn-icon" aria-label="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                    <span class="link-text">Dashboard</span>
                </a>
                <a href="inventory.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    <span class="link-text">Inventory</span>
                </a>
                <a href="pos.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="link-text">POS Kiosk</span>
                </a>
                <a href="accounts.html" class="nav-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span class="link-text">Accounts</span>
                </a>
                <a href="analytics.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <span class="link-text">Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Accounts Ledger</h1>
                    <p class="text-muted">Manage employee tabs and customer credit balances.</p>
                </div>
                <div class="quick-actions">
                    <button class="btn-primary" id="open-account-modal-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Register New Account
                    </button>
                </div>
            </header>

            <section class="card table-container">
                <div style="padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center;">
                    <div style="position: relative; width: 100%; max-width: 320px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" 
                            style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="account-search" class="form-control" placeholder="Search account by name..." style="padding-left: 36px;">
                    </div>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Account ID</th>
                            <th>Balance (Utang)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-table-body">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Registration Modal -->
    <div class="modal-overlay" id="account-modal">
        <div class="card modal-card" style="max-width: 420px;">
            <div class="card-header">
                <h3>Register Account</h3>
                <button class="btn-icon" id="close-account-modal-btn">✕</button>
            </div>
            <form id="account-form" style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">
                <div>
                    <label class="text-muted" style="font-size: 0.85rem; display: block; margin-bottom: 6px;">Customer / Employee Name</label>
                    <input type="text" id="acc-name" class="form-control" required placeholder="e.g., Juan Dela Cruz">
                </div>
                <div>
                    <label class="text-muted" style="font-size: 0.85rem; display: block; margin-bottom: 6px;">Initial Balance / Utang (₱)</label>
                    <input type="number" id="acc-balance" class="form-control" value="0" step="0.01">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
                    <button type="button" class="btn-secondary" id="cancel-account-modal-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="payment-modal">
        <div class="card modal-card" style="max-width: 400px;">
            <div class="card-header">
                <h3>Record Payment</h3>
                <button class="btn-icon" id="close-payment-modal-btn">✕</button>
            </div>
            <form id="payment-form" style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">
                <input type="hidden" id="pay-account-id">
                <div>
                    <label class="text-muted" style="font-size: 0.85rem; display: block; margin-bottom: 4px;" id="pay-account-label">Account Name</label>
                    <div style="font-size: 0.95rem; font-weight: 600; margin-bottom: 10px;" id="pay-account-balance-display">Current Balance: ₱0.00</div>
                </div>
                <div>
                    <label class="text-muted" style="font-size: 0.85rem; display: block; margin-bottom: 6px;">Payment Amount (₱)</label>
                    <input type="number" id="pay-amount" class="form-control" placeholder="0.00" step="0.01" min="0.50" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
                    <button type="button" class="btn-secondary" id="cancel-payment-modal-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Confirm Payment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="accounts.js"></script>
</body>
</html>
