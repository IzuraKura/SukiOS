<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Kiosk - Microbusiness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Collapsible Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <h2>Suki<span>OS</span></h2>
                <button id="sidebar-toggle" class="btn-icon" aria-label="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                    <span class="link-text">Dashboard</span>
                </a>
                <a href="inventory.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    <span class="link-text">Inventory</span>
                </a>
                <a href="pos.html" class="nav-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="link-text">POS Kiosk</span>
                </a>
                <a href="analytics.html" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <span class="link-text">Analytics</span>
                </a>
            </nav>
            <div class="theme-control">
                <button id="theme-toggle" class="btn-secondary">Theme Switch</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content pos-layout">
            
            <!-- Left Side: Interactive Product Catalog -->
            <section class="pos-catalog">
                <header class="page-header">
                    <div>
                        <h1 class="page-title">Point of Sale Terminal</h1>
                        <p class="text-muted">Tap products to build order cart.</p>
                    </div>
                </header>

                <div class="card toolbar-card">
                    <div class="toolbar-controls" style="flex-direction: column; gap: 12px;">
                        <div class="search-box">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="pos-search" placeholder="Search product to sell...">
                        </div>
                        <div class="category-pills" id="pos-category-pills" style="display: flex; gap: 8px; overflow-x: auto; width: 100%; padding-bottom: 4px;">
                            <button class="btn-secondary active" data-category="all">All</option>
                            <button class="btn-secondary" data-category="Snacks & Sweets">Snacks/Candies</button>
                            <button class="btn-secondary" data-category="Beverages">Beverages</button>
                            <button class="btn-secondary" data-category="Bakery & Pastries">Pastries</button>
                            <button class="btn-secondary" data-category="Daily Ulam">Ulam</button>
                        </div>
                    </div>
                </div>

                <!-- Product Card Grid -->
                <div class="product-grid" id="pos-product-grid">
                    <div class="empty-state card">
                        <p class="text-muted">No available stock to display. Add items in <strong>Inventory</strong> first.</p>
                    </div>
                </div>
            </section>

            <!-- Right Side: Live Transaction Checkout Cart -->
            <section class="pos-cart-panel">
                <div class="card cart-card">
                    <div class="card-header">
                        <h3>Current Order</h3>
                        <button class="btn-icon text-muted" id="clear-cart-btn" title="Clear Order">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>

                    <!-- Cart Item List -->
                    <div class="cart-items-wrapper">
                        <ul class="cart-list" id="cart-list">
                            <li class="empty-state">
                                <p class="text-muted">Cart is empty. Tap products to add.</p>
                            </li>
                        </ul>
                    </div>

                    <!-- Order Summary Totals -->
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span class="text-muted">Subtotal</span>
                            <span id="cart-subtotal">₱0.00</span>
                        </div>
                        <div class="summary-row total-row">
                            <strong>Total Amount</strong>
                            <strong id="cart-total" class="text-accent">₱0.00</strong>
                        </div>
                        <button class="btn-primary btn-checkout" id="checkout-btn" disabled>Complete Sale</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

        <!-- Custom Item Price Modal -->
    <div class="modal-overlay" id="custom-price-modal">
        <div class="card modal-card" style="max-width: 360px;">
            <div class="card-header">
                <h3>Enter Custom Price</h3>
            </div>
            <div style="padding: 16px 0;">
                <label class="text-muted" style="font-size: 0.85rem;">Price (₱)</label>
                <input type="number" id="custom-item-price" class="input-field" placeholder="0.00" step="1" style="font-size: 1.2rem; margin-top: 6px;">
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button class="btn-secondary" id="cancel-custom-price-btn">Cancel</button>
                <button class="btn-primary" id="confirm-custom-price-btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
